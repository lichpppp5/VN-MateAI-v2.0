[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120
# Test gọi dịch vụ ngoài thật bị bỏ qua mặc định; chạy riêng: pytest -m network
addopts = -m "not network" -p no:cacheprovider
markers =
    network: gọi dịch vụ ngoài thật (9Router, model LLM) — kết quả phụ thuộc mạng
