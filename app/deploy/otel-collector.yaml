# OpenTelemetry collector tối thiểu: nhận OTLP gRPC từ VN-MateAI, in ra log (thay exporter bằng
# Jaeger / Tempo / OTLP của nhà cung cấp khi triển khai thật).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
