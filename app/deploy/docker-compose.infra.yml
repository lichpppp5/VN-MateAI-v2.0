# Hạ tầng cho staging / dev có Docker (prompt cuối §138): PostgreSQL, Redis, S3, OpenTelemetry collector.
# Ứng dụng VN-MateAI chạy trên máy Windows (COM, micro, điều khiển màn hình) và nối vào các dịch vụ này:
#   VNMATEAI_REDIS_URL=redis://<host>:6379/0
#   VNMATEAI_OTEL_EXPORTER=otlp  OTEL_EXPORTER_OTLP_ENDPOINT=http://<host>:4317
#   config.json -> object_storage: {"backend": "s3", "endpoint": "<host>:8333", "bucket": "vnmateai",
#                                   "access_key_id": "...", "secret_access_key": "...", "secure": false}
#   Di trú dữ liệu: python scripts/migrate_sqlite_to_pg.py migrate --pg postgresql://vnmate:...@<host>:5432/vnmate
# Mật khẩu lấy từ biến môi trường / tệp .env (KHÔNG commit). Không có Docker: scripts/dev_infra.py.
name: vnmateai-infra

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vnmate
      POSTGRES_DB: vnmate
      POSTGRES_PASSWORD: ${VNMATE_PG_PASSWORD:?đặt VNMATE_PG_PASSWORD trong .env}
    ports: ["127.0.0.1:5432:5432"]   # chỉ máy này — ứng dụng chạy cùng host
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnmate -d vnmate"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Chỉ giữ số đếm ngắn hạn (rate limit, khoá đăng nhập) — không phải nguồn sự thật (§67).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${VNMATE_REDIS_PASSWORD:?đặt VNMATE_REDIS_PASSWORD}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VNMATE_REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.48
    # S3 BẮT BUỘC khoá (deploy/s3.json, sinh từ deploy/.env, không commit): bản sao lưu chứa bí mật.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.port.lance=0", "-s3.port.iceberg=0",
              "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["127.0.0.1:8333:8333"]
    volumes: ["s3data:/data", "./s3.json:/etc/seaweedfs/s3.json:ro"]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317"]
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
